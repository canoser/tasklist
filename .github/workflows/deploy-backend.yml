name: 🚀 Backend Deploy → Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'WebApp/Backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: 🧪 Test, Build & Deploy (Cloud Run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp/Backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 💾 Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('WebApp/Backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 📦 Restore Dependencies
        run: dotnet restore PlanlamaApp.sln

      - name: 🔨 Build (0 Hata kontrolü)
        run: dotnet build PlanlamaApp.sln -c Release --no-restore

      - name: 🧪 Run Tests
        run: |
          if [ -d "Tests" ]; then
            dotnet test PlanlamaApp.sln --no-build -c Release
          fi

      - name: 🔐 Authenticate to Google Cloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🚀 Deploy to Google Cloud Run
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: dersmatris-api
          project_id: dersmatris-saas
          region: europe-west1
          source: WebApp/Backend
          flags: '--allow-unauthenticated --port=8080 --cpu=1 --memory=512Mi --min-instances=0 --max-instances=1 --concurrency=80 --cpu-throttling'
