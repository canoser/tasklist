name: 🚀 Backend Deploy → Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'WebApp/Backend/**'   # Sadece backend değişince tetikle
  workflow_dispatch:           # Manuel tetikleme

jobs:
  test:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp/Backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 📦 Restore Dependencies
        run: dotnet restore PlanlamaApp.sln

      - name: 🔨 Build (0 Hata kontrolü)
        run: dotnet build PlanlamaApp.sln -c Release --no-restore

      # Test projesi varsa çalıştırır
      - name: 🧪 Run Tests
        run: |
          if [ -d "Tests" ]; then
            dotnet test PlanlamaApp.sln --no-build -c Release
          fi

  deploy:
    name: ✈️ Deploy → Fly.io
    runs-on: ubuntu-latest
    needs: test              # Test geçmeden deploy yok!
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🔐 Set Fly.io Secrets
        run: |
          flyctl secrets set ConnectionStrings__DefaultConnection="${{ secrets.PROD_DB_CONNECTION }}" --stage
          flyctl secrets set Jwt__Secret="${{ secrets.PROD_JWT_SECRET }}" --stage
        working-directory: WebApp/Backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy to Fly.io
        run: flyctl deploy --remote-only
        working-directory: WebApp/Backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
