name: Deploy Mentorum API (Google Cloud Run)

on:
  push:
    branches:
      - main
    paths:
      - 'mentörüm/Backend/**'
      - '.github/workflows/deploy-mentorum.yml'
  workflow_dispatch:

# Paralel deploy yarışını önle (aynı anda tek deploy)
concurrency:
  group: mentorum-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to Google Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: mentorum-api
          project_id: dersmatris-saas
          region: europe-west1
          source: mentörüm/Backend
          flags: '--allow-unauthenticated --port=8080 --cpu=1 --memory=512Mi --min-instances=0 --max-instances=1 --concurrency=80 --cpu-throttling'

      - name: Health Check
        run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused --retry-all-errors https://mentorum-api.dersmatris.com/health
