name: Deploy Mentorum API

on:
  push:
    branches:
      - main
    paths:
      - 'mentörüm/Backend/**'

# Paralel deploy yarışını önle (aynı anda tek deploy)
concurrency:
  group: mentorum-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to Fly.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly.io
        run: flyctl deploy --app mentorum-api
        working-directory: mentörüm/Backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health Check
        run: curl --fail --retry 10 --retry-delay 5 --retry-connrefused --retry-all-errors https://mentorum-api.dersmatris.com/health
