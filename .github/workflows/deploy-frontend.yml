name: 🌐 Frontend Deploy → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'WebApp/Frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp/Frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WebApp/Frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build Production Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://dersmatris-api.fly.dev/api
          VITE_CDN_URL: https://cdn.dersmatris.com

      - name: ☁️ Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dersmatris-app --branch=main
          workingDirectory: WebApp/Frontend
