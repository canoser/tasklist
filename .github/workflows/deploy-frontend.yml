name: 🌐 Frontend Deploy → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'WebApp/Frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp/Frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WebApp/Frontend/package-lock.json

      - name: 💾 Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: WebApp/Frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('WebApp/Frontend/package-lock.json') }}

      - name: 📦 Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 🔨 Build Production Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://dersmatris-api.fly.dev/api
          VITE_CDN_URL: https://cdn.dersmatris.com

      - name: ☁️ Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=dersmatris-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
