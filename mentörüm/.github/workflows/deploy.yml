name: Mentorum CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'Frontend/**'
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────
  # 1. Backend Test
  # ─────────────────────────────────────
  backend-test:
    name: Backend Testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: Backend

      - name: Build
        run: dotnet build --no-restore
        working-directory: Backend

  # ─────────────────────────────────────
  # 2. Frontend Test
  # ─────────────────────────────────────
  frontend-test:
    name: Frontend Testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: Frontend

      - name: Build Frontend
        run: npm run build
        working-directory: Frontend

  # ─────────────────────────────────────
  # 3. Production Deploy (Google Cloud Run)
  # ─────────────────────────────────────
  deploy:
    name: Production Deploy (Cloud Run)
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Backend Deploy (Google Cloud Run)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: mentorum-api
          project_id: dersmatris-saas
          region: europe-west1
          source: Backend
          flags: '--allow-unauthenticated --port=8080 --cpu=1 --memory=512Mi --min-instances=0 --max-instances=1 --concurrency=80 --cpu-throttling'
